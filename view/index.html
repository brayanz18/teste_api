<!DOCTYPE html><!--Declara que este documento segue o padrao HTML 5-->
<html lang="pt-BR"><!--define o idioma principal do documento como portugues do brasil-->

<head><!--cabeçalho do documento contendo metadados links externos -->
    <meta charset="UTF-8"><!--define a codificação de caracteres UTF-8 cono suporte a acentos -->
    <meta name="viewport" content="width=devide-width, initial-scale=1.0"><!-- garante suporte a telas responsivas em dispositivos moveis--> 
    <title>Tarefas App</title><!--Define o titulo que aparece na aba do navegador -->

    <!--link de importação da folha de estilos(CSS) do bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
</head><!--fechamento da seção de metadados-->

<body><!--Corpo da pagina onde fica o conteudo visivel para o usuario-->
    <!--Container do Spinner do carregamento-->
    <div class="d-flex justify-content-center">
        <!--Div que reinderiza o efeito visual de carregamento rotativo -->
        <div class="spinner-border" role="status" id="loading">
            <!--texto oculto para leitores de tela indicando estado de carregamento-->
            <span class="sy-only"></span>
        </div><!--fechamento do elemento do spinner -->
    </div><!--fechamento do container flex-->
    <!--titulo da seção centralizada usando uma classe utilitária de bootstrap-->
    <p class="h1 text-center"> Tarefas de um usuario</p>
    <!--Estrutura da tabela HTML estlizada com as classes utilitárias do bootstrap-->
    <table class="table table-hover " id="tasks">
        <!--conteudo interno (cabeçalhos e linhos) será inserido via Script.js-->

    </table>
    <!--Script para componentes interativos de bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--importação do arquivo Script.js prório conteno a logica de itegração com  a API-->
    <script src="script.js"></script>
</body><!--fechamento do corpo do documento-->

</html><!--fechamento da tag raiz do HTML-->
