<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Tarefas</title>
    <link href="https://cdn.jsdelivre.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class ="bg-light d-flex aling-items-center vh-100">
    <div class = "container">
        <div class="row-justify-content-center">
            <div class = "col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4"></h3>
                        <form onsubmit="login(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" class="form-control"placeholder="Digite seu usuario "required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">senha</label>
                                <input type="password" id="password" class="form-control" placeholder="Digite sua senha " required>

                            </div>
                            <button tipe="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                        </form>

                        <div class="text-center">
                            <small>Não tem uma conta? <a href="signup.html">Cadastre-se</a></small>
                        </div>
                    </div>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>
